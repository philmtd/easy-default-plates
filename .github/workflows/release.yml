# Builds the addon zip with the BigWigs packager whenever a version tag (v*) is pushed:
# - creates a GitHub release with the zip
# - uploads to CurseForge once "## X-Curse-Project-ID" is in the TOC and the CF_API_TOKEN secret is set
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history for the changelog)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package and publish
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
